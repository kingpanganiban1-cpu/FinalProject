<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Opportunities</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="box">
        <p>Jobs Available</p>
    </div>
<div class="jobcontainer">

    <div class="job-card">
        <div class="job-header">
            <div>
                <h2>Cook</h2>
                <p class="company">🍽️ Raketto Restaurant</p>
            </div>

        <span class="job-status">Hiring</span>
    </div>

    <div class="job-details">
        <span>📍 Cavite, Philippines</span>
        <span>💰 ₱10,000 - ₱15,000/month</span>
        <span>🕒 Part-Time</span>
        <span>🎓 Entry Level</span>
    </div>

    <p class="job-description">
        We are looking for a dedicated student cook to prepare meals, maintain
        kitchen cleanliness, and assist in daily food operations.
    </p>

    <div class="job-footer">
        <small>Posted 2 days ago</small>

        <div>
            <button class="details-btn">View Details</button>
            <button class="apply-btn">Apply Now</button>
        </div>
    </div>
</div>


    

</div>
</body>
</html>
